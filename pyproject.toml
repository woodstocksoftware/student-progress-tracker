[project]
name = "student-progress-tracker"
version = "1.0.0"
description = "MCP server for AI-powered student progress tracking and learning analytics"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
